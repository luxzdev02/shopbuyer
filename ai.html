<!DOCTYPE html>
<html lang="id">
<head>
<script src="/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Support — FNB NOKOS</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/theme-vars.css?v=3">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s;max-width:720px;margin:0 auto;}
@media (min-width:900px){ body{max-width:900px;box-shadow:0 0 40px rgba(0,0,0,.08);} }

/* ─── HEADER ─────────────────────────────── */
.app-bar{background:var(--header-bg,var(--surface));backdrop-filter:blur(20px);padding:13px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.back-btn{width:34px;height:34px;border-radius:10px;background:var(--surface2,var(--bg));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:14px;text-decoration:none;cursor:pointer;flex-shrink:0;}
.bar-mid{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.bar-avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,#3B82F6,#1D4ED8);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(37,99,235,.35);overflow:hidden;}
.bar-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.bar-avatar i{color:#fff;font-size:14px;}
.bar-title{font-size:15px;font-weight:800;letter-spacing:-.2px;}
.bar-sub{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px;}
.bar-sub .dot{width:6px;height:6px;border-radius:50%;background:#3B82F6;box-shadow:0 0 6px #3B82F6;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface2,var(--bg));border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* ─── SCROLL AREA ────────────────────────── */
.scroll{flex:1;overflow-y:auto;padding:18px 16px 10px;}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

/* ─── HERO (docs-style intro) ────────────── */
.ai-hero{background:linear-gradient(140deg,#0f2b5c 0%,#1e3a8a 55%,#1d4ed8 100%);border-radius:22px;padding:26px 22px;color:#fff;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(29,78,216,.3);}
.ai-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);}
.ai-hero::after{content:'';position:absolute;bottom:-70px;left:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.04);}
.ai-hero-mark{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;overflow:hidden;}
.ai-hero-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.ai-hero-mark i{font-size:24px;}
.ai-hero h1{position:relative;z-index:1;font-size:19px;font-weight:800;letter-spacing:-.2px;margin-bottom:5px;}
.ai-hero p{position:relative;z-index:1;font-size:12.5px;opacity:.85;line-height:1.6;max-width:320px;margin:0 auto;}
.ai-hero-badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:5px 13px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}

.prompt-lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.prompt-chips{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.prompt-chip{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px;transition:.2s;font-family:inherit;}
.prompt-chip:hover{border-color:#3B82F6;background:rgba(59,130,246,.05);}
.prompt-chip i{color:#3B82F6;font-size:13px;flex-shrink:0;}

/* ─── MESSAGES ───────────────────────────── */
.msg-row{display:flex;gap:9px;align-items:flex-end;margin-bottom:12px;}
.msg-row.me{justify-content:flex-end;}
.msg-avatar{width:28px;height:28px;border-radius:8px;flex-shrink:0;background:linear-gradient(140deg,#3B82F6,#1D4ED8);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.msg-avatar i{color:#fff;font-size:12px;}
.msg-bubble{max-width:76%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap;}
.msg-row.me .msg-bubble{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;border-bottom-right-radius:4px;}
.msg-row:not(.me) .msg-bubble{background:var(--surface);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-time{font-size:10px;opacity:.6;margin-top:5px;display:block;}

.typing-row{display:flex;gap:9px;align-items:flex-end;margin-bottom:12px;}
.typing-bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;padding:13px 16px;display:flex;gap:4px;align-items:center;}
.typing-bubble span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tdot 1.3s infinite;}
.typing-bubble span:nth-child(2){animation-delay:.15s;}
.typing-bubble span:nth-child(3){animation-delay:.3s;}
@keyframes tdot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.err-note{text-align:center;font-size:12px;color:#ef4444;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:9px 14px;margin:0 0 12px;}

/* ─── INPUT BAR ──────────────────────────── */
.input-bar{display:flex;gap:10px;padding:12px 14px;background:var(--surface);border-top:1px solid var(--border);align-items:flex-end;}
.input-bar textarea{flex:1;border:1px solid var(--border);background:var(--surface2,var(--bg));border-radius:20px;padding:11px 16px;font-size:14px;color:var(--text);outline:none;resize:none;max-height:100px;font-family:inherit;}
.input-bar textarea:focus{border-color:#3B82F6;}
.send-btn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(37,99,235,.32);transition:.2s;}
.send-btn:disabled{opacity:.5;box-shadow:none;}
.send-btn:active{transform:scale(.94);}
.disclaimer{font-size:10px;color:var(--muted);text-align:center;padding:0 14px 10px;background:var(--surface);}
</style>
</head>
<body>
<script src="/premium-loader.js?v=3"></script>

<div class="app-bar">
  <button class="back-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
  <div class="bar-mid">
    <div class="bar-avatar"><img src="https://files.catbox.moe/je2gz1.jpg" alt="AI"></div>
    <div>
      <div class="bar-title">AI Support</div>
      <div class="bar-sub"><span class="dot"></span> Online</div>
    </div>
  </div>
  <div class="bar-actions">
    <button class="icon-btn" id="clearBtn" title="Hapus percakapan"><i class="fas fa-trash"></i></button>
    <div style="position:relative" id="theme-wrap">
      <button class="icon-btn" onclick="document.getElementById('theme-dd').classList.toggle('open')" id="theme-icon-btn"><i class="fas fa-circle-half-stroke" id="t-ico"></i></button>
      <div id="theme-dd" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.15);min-width:150px;z-index:9999;">
        <button onclick="setThemePage('dark')" data-t="dark" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--text);font-family:inherit;"><i class="fas fa-moon"></i> Mode Gelap <i class="fas fa-check t-chk" style="margin-left:auto;opacity:0;color:#3b82f6"></i></button>
        <button onclick="setThemePage('light')" data-t="light" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--text);font-family:inherit;"><i class="fas fa-sun"></i> Mode Terang <i class="fas fa-check t-chk" style="margin-left:auto;opacity:0;color:#3b82f6"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="scroll" id="scroll">
  <div class="ai-hero" id="aiHero">
    <div class="ai-hero-mark"><img src="https://files.catbox.moe/je2gz1.jpg" alt="FNB NOKOS AI"></div>
    <h1>FNB NOKOS AI</h1>
    <p>Tanya apa saja seputar nomor virtual, OTP, top up saldo, atau akun kamu — dibalas otomatis, kapan saja.</p>
    <div class="ai-hero-badge"><i class="fas fa-bolt"></i> Gratis · Respons Super Cepat</div>
  </div>

  <div id="promptArea">
    <div class="prompt-lbl">Coba tanyakan</div>
    <div class="prompt-chips">
      <button class="prompt-chip" onclick="usePrompt(this)"><i class="fas fa-mobile-screen-button"></i> Bagaimana cara order nomor virtual OTP?</button>
      <button class="prompt-chip" onclick="usePrompt(this)"><i class="fas fa-wallet"></i> Cara top up saldo pakai QRIS gimana?</button>
      <button class="prompt-chip" onclick="usePrompt(this)"><i class="fas fa-key"></i> Bagaimana cara pakai API key FNB NOKOS?</button>
      <button class="prompt-chip" onclick="usePrompt(this)"><i class="fas fa-circle-question"></i> Nomor OTP saya belum masuk, kenapa?</button>
    </div>
  </div>

  <div id="messages"></div>
</div>

<div class="input-bar">
  <textarea id="msgInput" rows="1" placeholder="Tulis pertanyaan kamu..." onkeydown="handleKey(event)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
</div>
<div class="disclaimer">AI dapat membuat kesalahan. Untuk hal penting terkait akun, hubungi CS lewat menu Chat.</div>

<script>
let currentUser = null;
(function checkAuth(){
  const s = localStorage.getItem('user');
  if (!s) { location.href = '/login'; return; }
  currentUser = JSON.parse(s);
})();

function setThemePage(t){ window.DP_THEME.set(t); updateThemePageUI(); document.getElementById('theme-dd').classList.remove('open'); }
function updateThemePageUI(){ var t=window.DP_THEME.get(); document.getElementById('t-ico').className=t==='dark'?'fas fa-moon':'fas fa-sun'; document.querySelectorAll('[data-t]').forEach(function(el){ var chk=el.querySelector('.t-chk'); if(chk) chk.style.opacity=el.dataset.t===t?'1':'0'; }); }
document.addEventListener('click',function(e){ if(!e.target.closest('#theme-wrap')) document.getElementById('theme-dd')?.classList.remove('open'); });
updateThemePageUI();

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function formatTime(ts){ if(!ts) return ''; return new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

let history_ = [];

function renderMessages(){
  const el = document.getElementById('messages');
  document.getElementById('promptArea').style.display = history_.length ? 'none' : 'block';
  el.innerHTML = history_.map(m => {
    const isMe = m.role === 'user';
    return `
    <div class="msg-row ${isMe ? 'me' : ''}">
      ${!isMe ? '<div class="msg-avatar"><img src="https://files.catbox.moe/je2gz1.jpg" alt="AI"></div>' : ''}
      <div class="msg-bubble">${escapeHtml(m.content)}<span class="msg-time">${formatTime(m.timestamp)}</span></div>
    </div>`;
  }).join('');
  scrollBottom();
}

function scrollBottom(){
  const s = document.getElementById('scroll');
  s.scrollTop = s.scrollHeight;
}

function showTyping(show){
  let t = document.getElementById('typingRow');
  if (show) {
    if (t) return;
    t = document.createElement('div');
    t.id = 'typingRow';
    t.className = 'typing-row';
    t.innerHTML = `<div class="msg-avatar"><img src="https://files.catbox.moe/je2gz1.jpg" alt="AI"></div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
    document.getElementById('messages').appendChild(t);
    scrollBottom();
  } else {
    if (t) t.remove();
  }
}

function showErr(msg){
  let e = document.getElementById('errNote');
  if (e) e.remove();
  e = document.createElement('div');
  e.id = 'errNote';
  e.className = 'err-note';
  e.innerHTML = '<i class="fas fa-circle-exclamation"></i> ' + escapeHtml(msg);
  document.getElementById('messages').appendChild(e);
  scrollBottom();
}

async function loadHistory(){
  try {
    const r = await axios.get('/api/ai/conversation/' + currentUser.id);
    history_ = r.data.data || [];
    renderMessages();
  } catch(e) {}
}

function usePrompt(btn){
  document.getElementById('msgInput').value = btn.textContent.trim();
  sendMessage();
}

function handleKey(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';

  const errNote = document.getElementById('errNote');
  if (errNote) errNote.remove();

  history_.push({ role: 'user', content: text, timestamp: Date.now() });
  renderMessages();
  showTyping(true);

  try {
    const res = await axios.post('/api/ai/chat', { user_id: currentUser.id, message: text });
    showTyping(false);
    if (res.data && res.data.success) {
      history_.push({ role: 'assistant', content: res.data.reply, timestamp: res.data.timestamp || Date.now() });
      renderMessages();
    } else {
      showErr(res.data?.error || 'AI Support gagal membalas.');
    }
  } catch(e) {
    showTyping(false);
    showErr(e.response?.data?.error || 'Gagal menghubungi AI Support. Coba lagi.');
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('clearBtn').onclick = async () => {
  if (!confirm('Hapus semua riwayat percakapan dengan AI Support?')) return;
  try {
    await axios.post('/api/ai/clear', { user_id: currentUser.id });
    history_ = [];
    renderMessages();
  } catch(e) {}
};

loadHistory();
</script>
<script src="/auth-guard.js"></script>
</body>
</html>
